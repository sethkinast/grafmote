plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'net.graf.remote'
    compileSdk 34

    defaultConfig {
        applicationId 'net.graf.remote'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Only dependency. OkHttp provides the WebSocket client for the TV remote channel.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
