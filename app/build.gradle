plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'net.cogdev.grafmote'
    compileSdk 34

    defaultConfig {
        applicationId 'net.cogdev.grafmote'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.0.3'
    }

    signingConfigs {
        // Pinned DEBUG keystore committed at app/debug.keystore so every
        // CI debug APK shares one signature and installs as an update.
        // Standard debug credentials (android/android) — not secret.
        // NEVER commit release key material; release stays env-only.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing reads ONLY from environment variables so no key
        // material ever lands in the repo. CI decodes the KEYSTORE_BASE64
        // secret into a temp file and passes its path via KEYSTORE_PATH;
        // local release builds export the same four variables. When the
        // variables are absent (local dev, CI without secrets) this block
        // stays empty and debug builds are unaffected.
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Only dependency. OkHttp provides the WebSocket client for the TV remote channel.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
