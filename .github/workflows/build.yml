name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: grafmote-debug
          path: app/build/outputs/apk/debug/*.apk

  # Signed release APK. Stays green (skipped) until the repo has the four
  # secrets documented in README.md ("Release signing"). No key material is
  # committed: the keystore is decoded from KEYSTORE_BASE64 into a temp file
  # at job time, and app/build.gradle reads all values from env vars only.
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare keystore (skip if no secrets)
        id: keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Build signed release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.has_keystore == 'true'
        with:
          name: grafmote-release
          path: app/build/outputs/apk/release/*.apk

  # Rolling prerelease: GitHub Release assets download as raw files (no ZIP),
  # unlike actions/upload-artifact which always serves downloads as a ZIP.
  # Updates the same `latest` prerelease on every master push.
  publish:
    if: github.ref == 'refs/heads/master'
    needs: [build, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grafmote-debug
          path: ./artifacts/debug
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: grafmote-release
          path: ./artifacts/release
      - name: Rename APKs
        run: |
          mv ./artifacts/debug/*.apk ./grafmote-debug.apk
          if ls ./artifacts/release/*.apk 1> /dev/null 2>&1; then mv ./artifacts/release/*.apk ./grafmote-release.apk; fi
          ls -l ./*.apk
      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          name: Latest build
          body: Automated build from commit ${{ github.sha }}.
          files: |
            grafmote-*.apk

  # Versioned release: pushing a v* tag builds the signed release APK and
  # publishes it as a full (non-prerelease) GitHub release on that tag,
  # with the APK attached as grafmote.apk (as v1.0.0 was). The rolling
  # `latest` prerelease is untouched on tag pushes (publish is gated to
  # master). If the release secrets are missing the job fails rather than
  # publishing an empty release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grafmote-release
          path: ./artifacts/release
      - name: Rename APK
        run: |
          mv ./artifacts/release/*.apk ./grafmote.apk
          ls -l ./*.apk
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          name: ${{ github.ref_name }}
          files: grafmote.apk
